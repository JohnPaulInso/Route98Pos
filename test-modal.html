<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Modal Test - Route 98</title>
<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  padding: 20px;
  background: #f1f5f9;
}
.test-btn {
  display: block;
  width: 100%;
  max-width: 300px;
  padding: 16px;
  margin: 10px auto;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.test-btn:active {
  opacity: 0.8;
}
#status {
  padding: 12px;
  margin: 20px 0;
  background: white;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  font-family: monospace;
  font-size: 12px;
}
/* Portal and modal styles */
#cap-modal-portal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2147483647;
  pointer-events: none;
  overflow: visible;
  visibility: hidden;
}
.modal-backdrop {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 2147483646 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 16px !important;
  background: rgba(0, 0, 0, 0.6) !important;
  pointer-events: auto !important;
}
.modal {
  background: white;
  border-radius: 12px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
}
.modal-head {
  padding: 20px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head h3 {
  margin: 0;
  font-size: 18px;
}
.modal-body {
  padding: 20px;
  overflow-y: auto;
}
.modal-foot {
  padding: 16px 20px;
  border-top: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.btn {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary {
  background: #2563eb;
  color: white;
}
.btn-ghost {
  background: transparent;
  color: #64748b;
}
</style>
</head>
<body>
<h1 style="text-align:center;">Modal System Test</h1>
<div id="status">Status: Ready</div>

<button class="test-btn" onclick="testModal()">🔵 Test Basic Modal</button>
<button class="test-btn" onclick="testPortal()">🔍 Check Portal Exists</button>
<button class="test-btn" onclick="testZIndex()">📊 Check Z-Index Stack</button>

<div id="cap-modal-portal"></div>

<script>
function log(msg) {
  const status = document.getElementById('status');
  status.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' - ' + msg;
  console.log(msg);
}

function testPortal() {
  const portal = document.getElementById('cap-modal-portal');
  if (portal) {
    log('✅ Portal exists');
    log('Portal styles: ' + portal.style.cssText);
    log('Portal visibility: ' + window.getComputedStyle(portal).visibility);
    log('Portal pointer-events: ' + window.getComputedStyle(portal).pointerEvents);
  } else {
    log('❌ Portal NOT found!');
  }
}

function testZIndex() {
  const portal = document.getElementById('cap-modal-portal');
  const backdrop = document.querySelector('.modal-backdrop');
  const modal = document.querySelector('.modal');
  
  log('Portal z-index: ' + (portal ? window.getComputedStyle(portal).zIndex : 'N/A'));
  log('Backdrop z-index: ' + (backdrop ? window.getComputedStyle(backdrop).zIndex : 'N/A'));
  log('Modal z-index: ' + (modal ? window.getComputedStyle(modal).zIndex : 'N/A'));
}

function testModal() {
  log('🔵 Opening test modal...');
  
  const portal = document.getElementById('cap-modal-portal');
  if (!portal) {
    log('❌ Portal not found!');
    return;
  }

  // Show portal
  portal.style.setProperty("pointer-events", "auto", "important");
  portal.style.setProperty("visibility", "visible", "important");
  log('✅ Portal shown');

  // Create backdrop and modal
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>🎉 Test Modal</h3>
        <button class="btn btn-ghost" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <p>If you can see this modal, the system is working!</p>
        <p>Portal visibility: <strong>${portal.style.visibility}</strong></p>
        <p>Portal pointer-events: <strong>${portal.style.pointerEvents}</strong></p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" onclick="closeModal()">OK</button>
      </div>
    </div>
  `;

  portal.appendChild(backdrop);
  log('✅ Modal appended to portal');
  
  // Click backdrop to close
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) {
      closeModal();
    }
  });
}

function closeModal() {
  log('Closing modal...');
  const portal = document.getElementById('cap-modal-portal');
  const backdrop = document.querySelector('.modal-backdrop');
  
  if (backdrop) {
    backdrop.remove();
    log('✅ Backdrop removed');
  }
  
  if (portal && !document.querySelector('.modal-backdrop')) {
    portal.style.setProperty("pointer-events", "none", "important");
    portal.style.setProperty("visibility", "hidden", "important");
    log('✅ Portal hidden');
  }
}

// Log initial state
window.addEventListener('load', () => {
  log('Page loaded');
  testPortal();
});
</script>
</body>
</html>
